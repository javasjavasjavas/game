<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isla Bruma - Misterio</title>
  <style>
    :root {
      --bg: #0f1a20;
      --panel: #18262d;
      --frame: #2f474f;
      --text: #f1f3ee;
      --accent: #d7b15a;
      --muted: #9eb0a8;
      --ok: #8acb7b;
      --warn: #e19a62;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, #2f4f5d 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, #2e3f2f 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .layout {
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 1fr) 320px;
    }

    .game-wrap {
      border: 2px solid var(--frame);
      border-radius: 10px;
      overflow: hidden;
      background: #0d161a;
      min-height: 560px;
    }

    #game-root {
      width: 100%;
      height: 100%;
      min-height: 560px;
    }

    .panel {
      border: 2px solid var(--frame);
      border-radius: 10px;
      background: linear-gradient(180deg, #20343d 0%, var(--panel) 100%);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .block {
      border: 1px solid #3a5963;
      border-radius: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.14);
    }

    h1, h2, p {
      margin: 0;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    h2 {
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #clock {
      font-size: 1.2rem;
      font-weight: 700;
    }

    #location {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    #dialogue {
      min-height: 100px;
      line-height: 1.4;
      font-size: 0.95rem;
    }

    #choices {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #clues {
      margin: 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #status {
      font-size: 0.9rem;
      color: var(--warn);
      min-height: 20px;
    }

    .btn {
      width: 100%;
      border: 1px solid #516d75;
      border-radius: 6px;
      background: #26444c;
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
      text-align: left;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: #33555f;
    }

    .btn.accent {
      background: #73531f;
      border-color: #9a7442;
    }

    .btn.accent:hover {
      background: #87622a;
    }

    .small {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .success {
      color: var(--ok);
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .game-wrap, #game-root {
        min-height: 460px;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="game-wrap">
      <div id="game-root"></div>
    </section>
    <aside class="panel">
      <div class="block">
        <h1>Isla Bruma</h1>
        <p class="small">Aventura detectivesca inspirada en clásicos noventeros.</p>
      </div>

      <div class="block">
        <h2>Reloj</h2>
        <div id="clock">08:00</div>
        <div id="location">Ubicación: Muelle</div>
      </div>

      <div class="block">
        <h2>Diálogo</h2>
        <div id="dialogue">Explora las salas y haz clic en los personajes.</div>
        <div id="choices"></div>
      </div>

      <div class="block">
        <h2>Pistas</h2>
        <ul id="clues"></ul>
      </div>

      <div class="block">
        <h2>Acciones</h2>
        <button class="btn" id="wait-btn">Esperar 30 minutos</button>
        <button class="btn accent" id="solve-btn">Presentar acusación</button>
        <div id="status"></div>
      </div>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./game/main.js"></script>
</body>
</html>
